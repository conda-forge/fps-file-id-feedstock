schema_version: 1

context:
  version: "0.4.4"

package:
  name: fps-file-id
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/f/fps-file-id/fps_file_id-${{ version }}.tar.gz
    sha256: 534faacd3b971e88e9f6aec6969207cd10f7b864db898b5d7b26915e800b804a

build:
  noarch: python
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - uv-build
  run:
    - python >=${{ python_min }}
    - anyio
    - fps
    - jupyverse-api >=0.15.0,<0.16.0
    - jupyverse-file-id >=0.1.0,<0.2.0
    - jupyverse-file-watcher >=0.1.0,<0.2.0
    - pydantic
    - sqlite-anyio >=0.3.0,<0.4.0
    - structlog

tests:
  - python:
      imports: fps_file_id
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: BSD-3-Clause
  license_file: COPYING.md
  homepage: https://github.com/jupyter-server/jupyverse/tree/main/plugins/file_id
  summary: An FPS plugin for the file ID API.

extra:
  recipe-maintainers:
    - davidbrochart
